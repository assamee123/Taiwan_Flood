<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guangfu / Mataian Flood Simulation</title>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.122.0/Build/Cesium/Cesium.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.122.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="vendor/ngraph.graph.umd.js"></script>
<script src="vendor/ngraph.path.umd.js"></script>
<style>
  html, body, #map { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  .panel { position: absolute; background: rgba(20,30,40,.88); color: #eee; padding: 10px 14px; border-radius: 8px; font-size: 13px; }
  #ui { top: 10px; left: 10px; width: 300px; max-height: 70vh; overflow: auto; }
  #ts { bottom: 30px; left: 50%; transform: translateX(-50%); width: min(720px, 90vw); }
  .panel h3 { margin: 0 0 6px; font-size: 15px; }
  .panel label { display: block; margin-top: 6px; }
  input[type=range] { width: 100%; }
  #ui input[type=number] { width: 64px; }
  button { margin: 6px 4px 0 0; padding: 4px 10px; }
  .val { font-weight: bold; color: #7fd4ff; }
  small { color: #aab; }
  .grp { border-top: 1px solid #456; margin-top: 8px; padding-top: 2px; }
  #ticks { display: flex; justify-content: space-between; font-size: 10px; color: #aab; }
  #ticks span.ev { color: #ff8a65; font-weight: bold; }
  #legend { height: 10px; border-radius: 3px; margin-top: 6px;
            background: linear-gradient(90deg, rgb(120,200,235), rgb(5,50,120)); }
</style>
</head>
<body>
<div id="map"></div>

<div id="ui" class="panel" role="region" aria-label="Flood controls">
  <h3>Flood simulation – Guangfu, Hualien</h3>
  <fieldset style="border:0;padding:0;margin:0">
    <legend>Mode</legend>
    <label><input type="radio" name="mode" value="0"> A: Uniform water level (bathtub)</label>
    <label><input type="radio" name="mode" value="1" checked> B: Flash flood from source (hydrodynamic)</label>
  </fieldset>
  <small>Click the map to place the flood source (red pin). Water then follows the terrain downhill.</small>
  <div id="grpA" class="grp">
    <label for="level">Water level: <span id="lvl" class="val"></span> m</label>
    <input id="level" type="range" step="0.1">
    <label>Range (m): <input id="rmin" type="number" aria-label="Minimum level"> –
      <input id="rmax" type="number" aria-label="Maximum level"></label>
    <label for="rise">Rise speed: <span id="risev" class="val"></span> m/s</label>
    <input id="rise" type="range" min="0.1" max="10" step="0.1" value="1">
  </div>
  <div id="grpB" class="grp">
    <label for="qpk">Peak inflow: <span id="qpkv" class="val"></span> m³/s</label>
    <input id="qpk" type="range" min="100" max="20000" step="100" value="3000">
    <label for="dur">Hydrograph duration: <span id="durv" class="val"></span> h</label>
    <input id="dur" type="range" min="0.5" max="12" step="0.5" value="3">
    <label for="man">Manning n: <span id="manv" class="val"></span></label>
    <input id="man" type="range" min="0.02" max="0.1" step="0.005" value="0.04">
    <label for="tsc">Speed: <span id="tscv" class="val"></span>× real time</label>
    <input id="tsc" type="range" min="10" max="2000" step="10" value="300">
  </div>
  <label for="wop">Water opacity: <span id="wopv" class="val"></span></label>
  <input id="wop" type="range" min="0.2" max="1" step="0.05" value="0.85">
  <div id="legend" aria-hidden="true"></div><small>0 m &nbsp;→&nbsp; 4 m+ depth</small><br>
  <button id="play">▶ Play</button><button id="reset">Reset</button>
  <div id="info" style="margin-top:6px;line-height:1.5"></div>
  <div class="grp">
    <h3 style="font-size:13px">Emergency routing</h3>
    <label><input id="roads" type="checkbox" checked> Road accessibility (green → red)</label>
    <label for="blk">Impassable depth: <span id="blkv" class="val"></span> m</label>
    <input id="blk" type="range" min="0.1" max="1" step="0.05" value="0.3">
    <button id="routeBtn">Set route (2 clicks)</button><button id="clrRoute">Clear</button>
    <div id="routeInfo" style="margin-top:6px;line-height:1.5"><small>Routing off — pick two points for the fastest dry path.</small></div>
  </div>
</div>

<div id="ts" class="panel" role="region" aria-label="Sentinel-2 time series">
  <label for="date" style="margin:0">Sentinel-2 image: <span id="datev" class="val"></span> <span id="tag"></span></label>
  <input id="date" type="range" min="0" step="1" value="0">
  <div id="ticks"></div>
  <button id="tplay">▶ Animate time series</button>
  <label style="display:inline"><input id="s2" type="checkbox" checked> show imagery</label>
</div>

<div id="err" role="alert" style="position:absolute;bottom:4px;left:10px;right:10px;background:#b00020;color:#fff;padding:8px;font:12px monospace;display:none;white-space:pre-wrap"></div>
<script>
function showErr(m) { const e = document.getElementById("err"); e.style.display = "block"; e.textContent += m + "\n"; console.error(m); }
window.addEventListener("error", e => showErr("JS error: " + e.message + " @" + e.lineno));
window.addEventListener("unhandledrejection", e => showErr("Async error: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));

(async () => {
  const $ = id => document.getElementById(id);
  const meta = await (await fetch("data/meta.json")).json();
  const dem = new Float32Array(await (await fetch("data/dem.bin")).arrayBuffer());
  const rect = Cesium.Rectangle.fromDegrees(meta.west, meta.south, meta.east, meta.north);
  const EVENT = "20250923";   // Mataian Creek barrier-lake overflow into Guangfu

  const viewer = new Cesium.Viewer("map", {
    terrainProvider: await Cesium.CesiumTerrainProvider.fromUrl("terrain/"),
    baseLayer: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({ url: "https://tile.openstreetmap.org/" })),
    baseLayerPicker: false, geocoder: false, timeline: false, animation: false,
    sceneModePicker: false, navigationHelpButton: false, homeButton: false
  });
  window.viewer = viewer;
  const scene = viewer.scene;
  scene.globe.depthTestAgainstTerrain = true;
  scene.renderError.addEventListener((s, e) => showErr("Render error: " + (e && e.message || e)));
  viewer.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(121.39, 23.53, 16000),
                          orientation: { heading: 0, pitch: Cesium.Math.toRadians(-42), roll: 0 } });

  // ======================= Sentinel-2 time series =======================
  const fmt = d => `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)}`;
  const s2Layers = meta.dates.map(d => {
    const p = new Cesium.UrlTemplateImageryProvider({ url: `s2/${d}/{z}/{x}/{y}.png`,
      tilingScheme: new Cesium.GeographicTilingScheme(), rectangle: rect, minimumLevel: 8, maximumLevel: 13,
      credit: "Contains modified Copernicus Sentinel-2 data" });
    p.errorEvent.addEventListener(e => { e.retry = false; });
    const l = viewer.imageryLayers.addImageryProvider(p); l.show = false; return l;
  });
  let dateIdx = Math.max(0, meta.dates.findIndex(d => d > EVENT) - 1);   // last image before the event
  $("date").max = meta.dates.length - 1;
  $("ticks").innerHTML = meta.dates.map(d => `<span class="${d > EVENT && d < "20251101" ? "ev" : ""}">${d.slice(2, 4)}/${d.slice(4, 6)}</span>`).join("");
  function setDate(i) {
    dateIdx = i; $("date").value = i;
    s2Layers.forEach((l, k) => l.show = $("s2").checked && k === i);
    const d = meta.dates[i]; $("datev").textContent = fmt(d);
    $("tag").textContent = d < EVENT ? "(before 2025-09-23 flood)" : "(after 2025-09-23 flood)";
    $("tag").style.color = d < EVENT ? "#9ccc65" : "#ff8a65";
  }
  $("date").oninput = e => setDate(+e.target.value);
  $("s2").onchange = () => setDate(dateIdx);
  let tsTimer = null;
  $("tplay").onclick = () => {
    if (tsTimer) { clearInterval(tsTimer); tsTimer = null; $("tplay").textContent = "▶ Animate time series"; return; }
    $("tplay").textContent = "⏸ Stop";
    tsTimer = setInterval(() => setDate((dateIdx + 1) % meta.dates.length), 1500);
  };
  setDate(dateIdx);

  // ======================= Model grid (40 m, exactly aligned with DEM/imagery) =======================
  const F = 2, W = meta.w / F, H = meta.h / F, N = W * H;
  const z = new Float32Array(N);
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    let s = 0; for (let a = 0; a < F; a++) for (let b = 0; b < F; b++) s += dem[(r * F + a) * meta.w + c * F + b];
    z[r * W + c] = s / (F * F);
  }
  const latC = (meta.north + meta.south) / 2 * Math.PI / 180, G = 9.81;
  const DX = (meta.east - meta.west) / W * 111320 * Math.cos(latC), DY = (meta.north - meta.south) / H * 110574, CELL = DX * DY;
  const cellOf = (lon, lat) => {
    const c = Math.floor((lon - meta.west) / (meta.east - meta.west) * W);
    const r = Math.floor((meta.north - lat) / (meta.north - meta.south) * H);
    return (c < 2 || r < 2 || c >= W - 2 || r >= H - 2) ? -1 : r * W + c;
  };
  const depthAt = i => i < 0 ? 0 : mode === 0 ? Math.max(0, level - z[i]) : h[i];
  const MLON = 111320 * Math.cos(latC), MLAT = 110574;
  const metres = (lon1, lat1, lon2, lat2) => Math.hypot((lon2 - lon1) * MLON, (lat2 - lat1) * MLAT);
  const lonToX = lon => (lon - meta.west) / (meta.east - meta.west);
  const latToY = lat => (meta.north - lat) / (meta.north - meta.south);

  // ---- Mode B: local-inertial shallow-water model (Bates et al. 2010, LISFLOOD-FP style) ----
  const h = new Float32Array(N), qx = new Float32Array(N), qy = new Float32Array(N), kLim = new Float32Array(N);
  let simT = 0, volIn = 0, srcCells = [];
  const inflow = t => { const D = +$("dur").value * 3600, Q = +$("qpk").value, tp = D / 4;
    return t <= 0 || t >= D ? 0 : (t < tp ? Q * t / tp : Q * (D - t) / (D - tp)); };
  function stepB(dt) {
    const n2 = (+$("man").value) ** 2, gdt = G * dt;
    const face = (q, ei, ej, zi, zj, d) => {
      const hf = Math.max(ei, ej) - Math.max(zi, zj);
      if (hf <= 1e-3) return 0;
      const qm = hf * Math.sqrt(G * hf);                       // Froude <= 1 cap (steep terrain stability)
      const v = (q - gdt * hf * (ej - ei) / d) / (1 + gdt * n2 * Math.abs(q) / Math.pow(hf, 7 / 3));
      return v > qm ? qm : v < -qm ? -qm : v;
    };
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
      const i = r * W + c, ei = z[i] + h[i];
      if (c < W - 1) qx[i] = face(qx[i], ei, z[i + 1] + h[i + 1], z[i], z[i + 1], DX);
      if (r < H - 1) qy[i] = face(qy[i], ei, z[i + W] + h[i + W], z[i], z[i + W], DY);
    }
    for (let i = W; i < N - W; i++) {                         // no cell may export more than it holds
      const out = dt * ((Math.max(0, qx[i]) + Math.max(0, -qx[i - 1])) / DX + (Math.max(0, qy[i]) + Math.max(0, -qy[i - W])) / DY);
      kLim[i] = out > h[i] ? h[i] / out : 1;
    }
    for (let i = W; i < N - W; i++) { qx[i] *= qx[i] > 0 ? kLim[i] : kLim[i + 1]; qy[i] *= qy[i] > 0 ? kLim[i] : kLim[i + W]; }
    for (let r = 1; r < H - 1; r++) for (let c = 1; c < W - 1; c++) {
      const i = r * W + c, v = h[i] + dt * ((qx[i - 1] - qx[i]) / DX + (qy[i - W] - qy[i]) / DY);
      h[i] = v < 1e-6 ? 0 : v;
    }
    for (let c = 0; c < W; c++) { h[c] = 0; h[N - W + c] = 0; }          // open boundaries
    for (let r = 0; r < H; r++) { h[r * W] = 0; h[r * W + W - 1] = 0; }
    const Q = inflow(simT + dt / 2), add = Q * dt / CELL / srcCells.length;
    for (const k of srcCells) h[k] += add;
    volIn += Q * dt; simT += dt;
  }
  const stableDt = () => { let m = 0.01; for (let i = 0; i < N; i++) if (h[i] > m) m = h[i];
    return Math.min(10, 0.7 * Math.min(DX, DY) / Math.sqrt(G * m)); };

  // ======================= Water overlay (imagery layer = exact geographic draping) =======================
  const depthCv = document.createElement("canvas"); depthCv.width = W; depthCv.height = H;
  const dctx = depthCv.getContext("2d"), dimg = dctx.createImageData(W, H), px = dimg.data;
  let level = 0;
  function paint() {                                          // canvas row 0 = north, same as grid
    let wet = 0, dmax = 0;
    for (let i = 0; i < N; i++) {
      const d = depthAt(i), p = i * 4;
      if (d < 0.05) { px[p + 3] = 0; continue; }
      wet++; if (d > dmax) dmax = d;
      const k = Math.min(1, Math.sqrt(d / 4));
      px[p] = 120 - 115 * k; px[p + 1] = 200 - 150 * k; px[p + 2] = 235 - 115 * k; px[p + 3] = 150 + 105 * k;
    }
    dctx.putImageData(dimg, 0, 0);
    swapWater();
    return { wet, dmax };
  }
  // Minimal ImageryProvider that serves tiles cut from a canvas snapshot.
  class CanvasProvider {
    constructor(cv) {
      this.cv = cv; this.tilingScheme = new Cesium.GeographicTilingScheme(); this.rectangle = rect;
      this.tileWidth = this.tileHeight = 256; this.minimumLevel = 0; this.maximumLevel = 16;
      this.ready = true; this.readyPromise = Promise.resolve(true); this.hasAlphaChannel = true;
      this.errorEvent = new Cesium.Event(); this.credit = undefined; this.tileDiscardPolicy = undefined; this.proxy = undefined;
    }
    getTileCredits() { return undefined; }
    pickFeatures() { return undefined; }
    requestImage(x, y, l) {
      const r = this.tilingScheme.tileXYToRectangle(x, y, l), t = document.createElement("canvas");
      t.width = t.height = 256;
      const cw = this.cv.width, ch = this.cv.height;
      const sx = lonToX(r.west) * cw, sy = latToY(r.north) * ch;
      const sw = r.width / (rect.east - rect.west) * cw, sh = r.height / (rect.north - rect.south) * ch;
      const c = t.getContext("2d"); c.imageSmoothingEnabled = l < 13;
      c.drawImage(this.cv, sx, sy, sw, sh, 0, 0, 256, 256);
      return Promise.resolve(t);
    }
  }
  let waterLayer = null, roadLayer = null;
  function swapOverlay(cv, old) {                              // double-buffered refresh, no flicker
    const snap = document.createElement("canvas"); snap.width = cv.width; snap.height = cv.height;
    snap.getContext("2d").drawImage(cv, 0, 0);
    const layer = viewer.imageryLayers.addImageryProvider(new CanvasProvider(snap));
    if (old) setTimeout(() => viewer.imageryLayers.remove(old, true), 700);
    return layer;
  }
  function raiseRoads() { if (roadLayer) viewer.imageryLayers.raiseToTop(roadLayer); }
  function swapWater() {
    waterLayer = swapOverlay(depthCv, waterLayer);
    waterLayer.alpha = +$("wop").value;
    raiseRoads();
  }

  // ======================= UI =======================
  let mode = 1, playing = false, src = { lon: 121.42, lat: 23.665 };
  const srcPin = viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(src.lon, src.lat),
    point: { pixelSize: 11, color: Cesium.Color.RED, outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
             heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Infinity },
    label: { text: "Flood source", font: "13px sans-serif", pixelOffset: new Cesium.Cartesian2(0, -18),
             heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Infinity }
  });
  ["rise", "qpk", "dur", "man", "tsc", "wop"].forEach(id => { const f = () => $(id + "v").textContent = $(id).value; $(id).addEventListener("input", f); f(); });
  $("wop").addEventListener("input", () => waterLayer && (waterLayer.alpha = +$("wop").value));

  function setLevel(v) {
    const lo = +$("rmin").value, hi = +$("rmax").value;
    level = Math.min(hi, Math.max(lo, v));
    $("level").min = lo; $("level").max = hi; $("level").value = level; $("lvl").textContent = level.toFixed(1);
  }
  function showInfo(wet, dmax) {
    const zs = z[cellOf(src.lon, src.lat)].toFixed(1);
    $("info").innerHTML = mode === 0
      ? `Flooded: ${(wet * CELL / 1e6).toFixed(2)} km² | max depth ${dmax.toFixed(1)} m<br>Ground at source: ${zs} m`
      : `Sim time: <b>${Math.floor(simT / 3600)}h ${String(Math.floor(simT % 3600 / 60)).padStart(2, "0")}m</b> | inflow ${inflow(simT).toFixed(0)} m³/s<br>` +
        `Flooded: ${(wet * CELL / 1e6).toFixed(2)} km² | max depth ${dmax.toFixed(1)} m<br>` +
        `Volume in: ${(volIn / 1e6).toFixed(2)} million m³ | ground at source ${zs} m`;
  }
  function reset() {
    h.fill(0); qx.fill(0); qy.fill(0); simT = 0; volIn = 0;
    const i = cellOf(src.lon, src.lat); srcCells = [];
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) srcCells.push(i + a * W + b);
    const lo = Math.floor(z[i]) - 1; $("rmin").value = lo; $("rmax").value = lo + 30; setLevel(lo);
    const s = paint(); showInfo(s.wet, s.dmax);
  }
  function applyMode() {
    $("grpA").style.display = mode === 0 ? "" : "none"; $("grpB").style.display = mode === 1 ? "" : "none"; reset();
  }
  document.querySelectorAll("input[name=mode]").forEach(r => r.onchange = () => { mode = +r.value; applyMode(); });
  $("level").oninput = e => { setLevel(+e.target.value); const s = paint(); showInfo(s.wet, s.dmax); };
  $("rmin").onchange = $("rmax").onchange = () => setLevel(level);
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "⏸ Pause" : "▶ Play"; };
  $("reset").onclick = reset;

  // ======================= Emergency routing: OSM road graph + flood-aware A* =======================
  // Roads come from a pre-extracted OSM overlay (data/roads.geojson); pathfinding is ngraph.path,
  // which supplies the blocked()/distance() hooks the flood state plugs into.
  const VMAX = 25;                                             // m/s; >= fastest class, so the A* heuristic never overestimates
  const SPEED_KMH = { motorway: 90, motorway_link: 45, trunk: 70, trunk_link: 35, primary: 60, primary_link: 30,
    secondary: 50, secondary_link: 25, tertiary: 40, tertiary_link: 20, unclassified: 40, residential: 30,
    living_street: 20, service: 20, road: 30, track: 20 };
  const ROAD_COLORS = ["#2ecc71", "#a3e635", "#facc15", "#fb923c", "#ef4444", "#7f1d1d"];
  const RC = 2;                                                // road canvas = 2x model grid (~20 m/px)
  const roadsCv = document.createElement("canvas");
  roadsCv.width = W * RC; roadsCv.height = H * RC;
  const rctx = roadsCv.getContext("2d");
  const SAMPLE_STEP = Math.min(DX, DY);

  let roadsVisible = true, roadPainted = false, routeDirty = false, lastRouteAt = 0;
  let graph = null, router = null, linkList = [], roadSegs = [];
  let routeMode = false, routePts = [], routeLinks = [];

  const sampleCells = (lon1, lat1, lon2, lat2) => {            // cell indices along a segment, so long links can't skip a flooded cell
    const n = Math.min(64, Math.max(1, Math.ceil(metres(lon1, lat1, lon2, lat2) / SAMPLE_STEP)));
    const out = [];
    for (let k = 0; k < n; k++) {
      const t = n === 1 ? 0.5 : k / (n - 1);
      out.push(cellOf(lon1 + (lon2 - lon1) * t, lat1 + (lat2 - lat1) * t));
    }
    return out;
  };

  async function loadRoads() {
    const gj = await (await fetch("data/roads.geojson")).json();
    graph = createGraph();
    const ids = new Set(), seen = new Set();
    const nodeId = (lon, lat) => {                             // 5-decimal keys make ways share vertices
      const id = lon.toFixed(5) + "," + lat.toFixed(5);
      if (!ids.has(id)) { ids.add(id); graph.addNode(id, { lon, lat }); }
      return id;
    };
    for (const f of gj.features) {
      const v0 = (SPEED_KMH[f.properties.c] || 30) / 3.6, c = f.geometry.coordinates;
      let pid = null, plon = 0, plat = 0;
      for (let k = 0; k < c.length; k++) {
        const lon = c[k][0], lat = c[k][1], id = nodeId(lon, lat);
        if (pid !== null && id !== pid) {
          const key = pid < id ? pid + "|" + id : id + "|" + pid;
          if (!seen.has(key)) {
            seen.add(key);
            const len = metres(plon, plat, lon, lat);
            const link = graph.addLink(pid, id, { len, v0, samples: sampleCells(plon, plat, lon, lat),
              depth: 0, blocked: false, bucket: -1, cost: len / v0 });
            linkList.push(link);
            roadSegs.push({ ax: lonToX(plon) * roadsCv.width, ay: latToY(plat) * roadsCv.height,
                            bx: lonToX(lon) * roadsCv.width, by: latToY(lat) * roadsCv.height, link });
          }
        }
        pid = id; plon = lon; plat = lat;
      }
    }
    router = ngraphPath.aStar(graph, {
      distance: (a, b, link) => link.data.cost,
      blocked: (a, b, link) => link.data.blocked,
      heuristic: (a, b) => metres(a.data.lon, a.data.lat, b.data.lon, b.data.lat) / VMAX
    });
    roadPainted = false;
  }

  function refreshRoads() {                                    // flood exposure -> travel cost per link
    if (!graph) return 0;
    const blk = +$("blk").value;
    let changed = 0;
    for (const link of linkList) {
      const s = link.data.samples;
      let d = 0;
      for (let k = 0; k < s.length; k++) { const v = depthAt(s[k]); if (v > d) d = v; }
      const blocked = d > blk;
      const bucket = blocked ? 5 : Math.min(5, Math.floor(d / blk * 5));
      if (bucket !== link.data.bucket) { link.data.bucket = bucket; changed++; }
      link.data.depth = d;
      link.data.blocked = blocked;
      link.data.cost = link.data.len / (link.data.v0 * (1 - 0.8 * Math.min(1, d / blk)));   // deep = slow, then blocked
    }
    return changed;
  }

  function paintRoads() {
    rctx.clearRect(0, 0, roadsCv.width, roadsCv.height);
    const paths = ROAD_COLORS.map(() => new Path2D());
    for (const s of roadSegs) {
      const b = s.link.data.bucket;
      const p = paths[b < 0 ? 0 : b];
      p.moveTo(s.ax, s.ay); p.lineTo(s.bx, s.by);
    }
    rctx.lineWidth = 1.5; rctx.lineCap = "round";
    for (let b = 0; b < paths.length; b++) { rctx.strokeStyle = ROAD_COLORS[b]; rctx.stroke(paths[b]); }
    roadPainted = true;
  }

  function swapRoads() {
    roadLayer = swapOverlay(roadsCv, roadLayer);
    roadLayer.show = roadsVisible;
    raiseRoads();
  }

  const pinOf = (color, text) => viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(121.4, 23.66), show: false,
    point: { pixelSize: 10, color, outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
             heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Infinity },
    label: { text, font: "12px sans-serif", pixelOffset: new Cesium.Cartesian2(0, -16),
             heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Infinity }
  });
  const startPin = pinOf(Cesium.Color.LIME, "Start"), endPin = pinOf(Cesium.Color.ORANGE, "End");
  const routeLine = viewer.entities.add({ show: false,
    polyline: { positions: [], width: 5, clampToGround: true, material: Cesium.Color.fromCssColorString("#00e5ff") } });

  function nearestNode(lon, lat) {                             // prefer a dry road node, else the closest one
    const blk = +$("blk").value;
    let best = null, bd = Infinity, dry = null, dd = Infinity;
    graph.forEachNode(n => {
      const d = metres(lon, lat, n.data.lon, n.data.lat);
      if (d < bd) { bd = d; best = n; }
      if (d < dd && depthAt(cellOf(n.data.lon, n.data.lat)) <= blk) { dd = d; dry = n; }
    });
    return (dry && dd < 500) ? dry : best;
  }
  const linkBetween = (a, b) => {
    let res = null;
    graph.getLinks(a).forEach(l => { if (!res && (l.toId === b || l.fromId === b)) res = l; });
    return res;
  };

  function computeRoute() {
    routeDirty = false;
    lastRouteAt = performance.now();
    routeLinks = [];
    if (!router || routePts.length < 2) { routeLine.show = false; return; }
    const A = nearestNode(routePts[0].lon, routePts[0].lat), B = nearestNode(routePts[1].lon, routePts[1].lat);
    if (!A || !B) {
      routeLine.show = false;
      $("routeInfo").innerHTML = `<small>No road network near those points.</small>`;
      return;
    }
    if (A.id === B.id) {
      routeLine.show = false;
      $("routeInfo").innerHTML = `<small>Both points snapped to the same road node — pick a farther destination.</small>`;
      return;
    }
    // ngraph.path returns nodes destination -> source, and a single node when no path exists.
    const nodes = router.find(A.id, B.id).reverse();
    if (nodes.length < 2) {
      routeLine.show = false;
      $("routeInfo").innerHTML = `<b>No dry route</b> — the points are cut off from each other.` +
        `<br><small>Raise the impassable depth, or move a point to drier ground.</small>`;
      return;
    }
    const coords = [routePts[0].lon, routePts[0].lat];          // connector from the raw click
    let dist = 0, time = 0, wet = 0;
    for (let k = 0; k < nodes.length; k++) {
      coords.push(nodes[k].data.lon, nodes[k].data.lat);
      if (k) {
        const link = linkBetween(nodes[k - 1].id, nodes[k].id);
        if (link) { dist += link.data.len; time += link.data.cost; if (link.data.blocked) wet++; routeLinks.push(link); }
      }
    }
    coords.push(routePts[1].lon, routePts[1].lat);
    routeLine.polyline.positions = Cesium.Cartesian3.fromDegreesArray(coords);
    routeLine.show = true;
    $("routeInfo").innerHTML = `<b>${(dist / 1000).toFixed(2)} km</b> · ETA <b>${Math.max(1, Math.round(time / 60))} min</b>` +
      (wet ? ` · <span style="color:#ff8a65">crosses ${wet} flooded link(s)</span>` : ` · flood-free`) +
      `<br><small>Recalculated as the flood moves.</small>`;
  }

  function updateRoads() {
    if (!graph) return;
    const changed = refreshRoads();
    if (roadsVisible && (changed || !roadPainted)) { paintRoads(); swapRoads(); }
    if (routePts.length > 1) {
      const cut = routeLinks.some(l => l.data.blocked);
      if (routeDirty || cut || (changed && performance.now() - lastRouteAt > 2000)) computeRoute();
    }
  }

  $("roads").onchange = e => {
    roadsVisible = e.target.checked;
    if (roadLayer) roadLayer.show = roadsVisible;
    if (roadsVisible) roadPainted = false;
  };
  $("blk").oninput = e => { $("blkv").textContent = (+e.target.value).toFixed(2); routeDirty = true; };
  $("blkv").textContent = (+$("blk").value).toFixed(2);
  $("routeBtn").onclick = () => {
    routeMode = !routeMode;
    $("routeBtn").textContent = routeMode ? "Cancel route pick" : "Set route (2 clicks)";
    routePts = []; routeLinks = [];
    startPin.show = endPin.show = routeLine.show = false;
    $("routeInfo").innerHTML = routeMode ? "<small>Click the start point.</small>" : "<small>Routing off.</small>";
  };
  $("clrRoute").onclick = () => {
    routeMode = false; routePts = []; routeLinks = [];
    $("routeBtn").textContent = "Set route (2 clicks)";
    startPin.show = endPin.show = routeLine.show = false;
    $("routeInfo").innerHTML = "<small>Route cleared.</small>";
  };
  loadRoads().catch(e => showErr("Roads unavailable (data/roads.geojson): " + e.message));

  new Cesium.ScreenSpaceEventHandler(scene.canvas).setInputAction(e => {
    const c = scene.globe.pick(viewer.camera.getPickRay(e.position), scene);
    if (!c) return;
    const g = Cesium.Cartographic.fromCartesian(c), lon = Cesium.Math.toDegrees(g.longitude), lat = Cesium.Math.toDegrees(g.latitude);
    if (routeMode) {                                            // two clicks define start + destination
      if (!graph) return;
      if (routePts.length >= 2) { routePts = []; }
      routePts.push({ lon, lat });
      startPin.position = Cesium.Cartesian3.fromDegrees(routePts[0].lon, routePts[0].lat);
      startPin.show = true;
      endPin.show = routePts.length > 1;
      if (routePts.length > 1) {
        endPin.position = Cesium.Cartesian3.fromDegrees(lon, lat);
        computeRoute();
      } else {
        routeLine.show = false;
        $("routeInfo").innerHTML = "<small>Now click the destination.</small>";
      }
      return;
    }
    if (cellOf(lon, lat) < 0) return;
    src = { lon, lat }; srcPin.position = Cesium.Cartesian3.fromDegrees(lon, lat); reset();
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  let last = performance.now(), lastPaint = 0, lastRoadTick = 0;
  scene.preRender.addEventListener(() => {
    const now = performance.now(), rdt = Math.min(0.1, (now - last) / 1000); last = now;
    if (now - lastRoadTick > 400) { lastRoadTick = now; updateRoads(); }   // keeps running while paused
    if (!playing) return;
    if (mode === 0) {
      setLevel(level + rdt * $("rise").value);
      if (level >= +$("rmax").value) $("play").click();
    } else {
      let todo = rdt * $("tsc").value; const t0 = performance.now();
      while (todo > 0 && performance.now() - t0 < 25) { const dt = Math.min(stableDt(), todo); stepB(dt); todo -= dt; }
    }
    if (now - lastPaint > 400) { lastPaint = now; const s = paint(); showInfo(s.wet, s.dmax); }
  });

  window._sim = { h, z, W, H, cellOf, depthAt, refreshRoads, paintRoads,
    roads: () => ({ graph, router, linkList, roadSegs, routePts, routeLinks }),
    setRoute: (a, b) => { routePts = [a, b]; computeRoute(); },
    setSource: (lon, lat) => { src = { lon, lat }; srcPin.position = Cesium.Cartesian3.fromDegrees(lon, lat); reset(); } };
  applyMode();
  $("play").click();
})();
</script>
</body>
</html>
