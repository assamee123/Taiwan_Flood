<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Guangfu / Mataian Flood Simulation</title>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.122.0/Build/Cesium/Cesium.js"></script>
<link href="https://cdn.jsdelivr.net/npm/cesium@1.122.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  html, body, #map { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
  #ui { position: absolute; top: 10px; left: 10px; background: rgba(20,30,40,.85); color: #eee; padding: 12px 14px;
        border-radius: 8px; width: 290px; font-size: 13px; }
  #ui h3 { margin: 0 0 8px; font-size: 15px; }
  #ui label { display: block; margin-top: 8px; }
  #ui input[type=range] { width: 100%; }
  #ui input[type=number] { width: 70px; }
  #ui button { margin: 8px 4px 0 0; padding: 4px 10px; }
  #lvl { font-weight: bold; color: #7fd4ff; }
  small { color: #aab; }
</style>
</head>
<body>
<div id="map"></div>
<div id="ui" role="region" aria-label="Flood controls">
  <h3>Flood simulation – Guangfu, Hualien</h3>
  <fieldset style="border:0;padding:0;margin:0">
    <legend>Mode</legend>
    <label><input type="radio" name="mode" value="0"> A: Uniform level (bathtub)</label>
    <label><input type="radio" name="mode" value="1" checked> B: Connected flood from source</label>
  </fieldset>
  <small>Mode B: click the map to set the flood source.</small>
  <label for="level">Water level: <span id="lvl"></span> m</label>
  <input id="level" type="range" step="0.1">
  <label>Range (m):
    <input id="rmin" type="number" value="119" aria-label="Minimum level"> –
    <input id="rmax" type="number" value="159" aria-label="Maximum level">
  </label>
  <label for="speed">Rise speed: <span id="spdv"></span> m/s</label>
  <input id="speed" type="range" min="0.1" max="10" step="0.1" value="1">
  <label><input id="s2" type="checkbox" checked> Sentinel-2 image (2025-07-25)</label>
  <button id="play">▶ Play</button><button id="reset">Reset</button>
  <div id="info" style="margin-top:8px"></div>
</div>
<div id="err" role="alert" style="position:absolute;bottom:10px;left:10px;right:10px;background:#b00020;color:#fff;padding:8px;font:12px monospace;display:none;white-space:pre-wrap"></div>
<script>
function showErr(m) { const e = document.getElementById("err"); e.style.display = "block"; e.textContent += m + "\n"; console.error(m); }
window.addEventListener("error", e => showErr("JS error: " + e.message + " @" + e.lineno));
window.addEventListener("unhandledrejection", e => showErr("Async error: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason)));
(async () => {
  Cesium.Ion.defaultAccessToken = "";
  const meta = await (await fetch("data/meta.json")).json();
  const dem = new Float32Array(await (await fetch("data/dem.bin")).arrayBuffer());
  const rect = Cesium.Rectangle.fromDegrees(meta.west, meta.south, meta.east, meta.north);

  const viewer = new Cesium.Viewer("map", {
    terrainProvider: await Cesium.CesiumTerrainProvider.fromUrl("terrain/"),
    baseLayer: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({ url: "https://tile.openstreetmap.org/" })),
    baseLayerPicker: false, geocoder: false, timeline: false, animation: false,
    sceneModePicker: false, navigationHelpButton: false, homeButton: false
  });
  window.viewer = viewer;
  const scene = viewer.scene;
  // Frame the study area right away, before anything else can fail
  viewer.camera.setView({ destination: Cesium.Cartesian3.fromDegrees(121.40, 23.50, 17000),
                          orientation: { heading: 0, pitch: Cesium.Math.toRadians(-40), roll: 0 } });
  scene.renderError.addEventListener((s, e) => showErr("Render error: " + (e && e.message || e)));
  scene.globe.depthTestAgainstTerrain = true;
  scene.verticalExaggeration = 1.0;
  // Sentinel-2 as small tiles (one large PNG failed to load in some browsers)
  const s2 = viewer.imageryLayers.addImageryProvider(new Cesium.UrlTemplateImageryProvider({
    url: "s2tiles/{z}/{x}/{y}.png", tilingScheme: new Cesium.GeographicTilingScheme(),
    rectangle: rect, minimumLevel: 8, maximumLevel: 13, credit: "Sentinel-2 (ESA Copernicus)"
  }));
  s2.imageryProvider.errorEvent.addEventListener(e => { e.retry = false; }); // missing tiles = transparent

  // ---- UI state ----
  const $ = id => document.getElementById(id);
  let mode = 1, level = 110, playing = false;
  let src = { lon: 121.42, lat: 23.665 };          // default: Guangfu town
  let fill = null;                                 // Float32Array: min level at which each cell is reached

  const idx = (lon, lat) => {
    const c = Math.floor((lon - meta.west) / (meta.east - meta.west) * meta.w);
    const r = Math.floor((meta.north - lat) / (meta.north - meta.south) * meta.h);
    return (c < 0 || r < 0 || c >= meta.w || r >= meta.h) ? -1 : r * meta.w + c;
  };

  // Priority-flood (minimax path) from source: fill[i] = lowest water level that connects i to source.
  function floodFrom(start, maxLevel) {
    const n = meta.w * meta.h, W = meta.w;
    const f = new Float32Array(n).fill(Infinity);
    const hk = new Float32Array(n), hv = new Int32Array(n); let hs = 0;   // binary min-heap
    const push = (k, v) => { let i = hs++; while (i > 0) { const p = (i - 1) >> 1; if (hk[p] <= k) break; hk[i] = hk[p]; hv[i] = hv[p]; i = p; } hk[i] = k; hv[i] = v; };
    const pop = () => { const v = hv[0], k = hk[--hs], x = hv[hs]; let i = 0;
      while (true) { let c = 2 * i + 1; if (c >= hs) break; if (c + 1 < hs && hk[c + 1] < hk[c]) c++; if (hk[c] >= k) break; hk[i] = hk[c]; hv[i] = hv[c]; i = c; }
      hk[i] = k; hv[i] = x; return v; };
    f[start] = dem[start]; push(f[start], start);
    while (hs) {
      const i = pop(), fi = f[i]; if (fi > maxLevel) break;
      const r = (i / W) | 0, c = i - r * W;
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
        const rr = r + dr, cc = c + dc; if ((!dr && !dc) || rr < 0 || cc < 0 || rr >= meta.h || cc >= W) continue;
        const j = rr * W + cc; if (f[j] !== Infinity) continue;
        f[j] = Math.max(fi, dem[j]); push(f[j], j);
      }
    }
    return f;
  }

  // Encode fill (R) and DEM (G) relative to [rmin, rmax] into an 8-bit texture.
  const canvas = document.createElement("canvas");
  canvas.width = meta.w; canvas.height = meta.h;
  function buildTexture() {
    const lo = +$("rmin").value, hi = +$("rmax").value, s = 255 / (hi - lo);
    const ctx = canvas.getContext("2d"), img = ctx.createImageData(meta.w, meta.h), d = img.data;
    for (let i = 0; i < dem.length; i++) {
      d[i * 4]     = Math.min(255, Math.max(0, (fill[i] - lo) * s)); // Infinity -> 255 (never)
      d[i * 4 + 1] = Math.min(255, Math.max(0, (dem[i] - lo) * s));
      d[i * 4 + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    material.uniforms.image = canvas;   // pass the canvas directly (no data-URL round trip)
    material.uniforms.base = lo; material.uniforms.scale = (hi - lo) / 255;
  }

  // ---- Water surface: flat rectangle at height 0, lifted with modelMatrix ----
  const material = new Cesium.Material({
    fabric: {
      uniforms: { image: Cesium.Material.DefaultImageId, level: level, base: 100, scale: 0.2, mode: 1,
                  shallow: new Cesium.Color(0.45, 0.75, 0.9, 0.55), deep: new Cesium.Color(0.02, 0.18, 0.4, 0.85), time: 0 },
      source: `
        czm_material czm_getMaterial(czm_materialInput mi) {
          czm_material m = czm_getDefaultMaterial(mi);
          vec4 t = texture(image, mi.st);
          float fillLv = base + t.r * 255.0 * scale;
          float demLv  = base + t.g * 255.0 * scale;
          bool wet = mode > 0.5 ? (t.r < 0.998 && fillLv <= level) : (demLv <= level);
          if (!wet) { m.alpha = 0.0; return m; }
          float depth = level - demLv;
          float k = clamp(depth / 5.0, 0.0, 1.0);
          vec2 p = mi.st * 900.0;
          float w = sin(p.x + time * 1.7) * cos(p.y * 1.3 + time * 1.1);
          m.normal = normalize(mi.normalEC + 0.08 * vec3(w, w * 0.5, 0.0));
          m.diffuse = mix(shallow.rgb, deep.rgb, k);
          m.specular = 0.6; m.shininess = 40.0;
          m.alpha = mix(shallow.a, deep.a, k);
          return m;
        }`
    }
  });
  const water = scene.primitives.add(new Cesium.Primitive({
    geometryInstances: new Cesium.GeometryInstance({
      geometry: new Cesium.RectangleGeometry({ rectangle: rect, height: 0, granularity: Cesium.Math.toRadians(0.002),
                                               vertexFormat: Cesium.MaterialAppearance.MaterialSupport.TEXTURED.vertexFormat })
    }),
    appearance: new Cesium.MaterialAppearance({ material, translucent: true,
                                                materialSupport: Cesium.MaterialAppearance.MaterialSupport.TEXTURED }),
    asynchronous: false
  }));
  const center = Cesium.Cartesian3.fromRadians(Cesium.Rectangle.center(rect).longitude, Cesium.Rectangle.center(rect).latitude, 0);
  const up = scene.globe.ellipsoid.geodeticSurfaceNormal(center, new Cesium.Cartesian3());

  const srcPin = viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(src.lon, src.lat),
    point: { pixelSize: 10, color: Cesium.Color.RED, outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
             heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Infinity },
    label: { text: "Flood source", font: "13px sans-serif", pixelOffset: new Cesium.Cartesian2(0, -18),
             heightReference: Cesium.HeightReference.CLAMP_TO_GROUND, disableDepthTestDistance: Infinity }
  });

  // Start the range just below the source ground so the water appears immediately.
  function autoRange() {
    const g = dem[idx(src.lon, src.lat)], lo = Math.floor(g) - 1;
    $("rmin").value = lo; $("rmax").value = lo + 40; level = lo;
  }

  function recompute() {
    const i = idx(src.lon, src.lat); if (i < 0) return;
    fill = floodFrom(i, +$("rmax").value);
    buildTexture(); updateLevel(level);
  }

  function updateLevel(v) {
    const lo = +$("rmin").value, hi = +$("rmax").value;
    level = Math.min(hi, Math.max(lo, v));
    $("level").min = lo; $("level").max = hi; $("level").value = level;
    $("lvl").textContent = level.toFixed(1);
    material.uniforms.level = level; material.uniforms.mode = mode;
    water.modelMatrix = Cesium.Matrix4.fromTranslation(Cesium.Cartesian3.multiplyByScalar(up, level, new Cesium.Cartesian3()));
    // flooded area (km²), approx cell area at 20 m
    let n = 0; const ref = mode ? fill : dem;
    for (let i = 0; i < ref.length; i++) if (ref[i] <= level) n++;
    const cellKm2 = (meta.east - meta.west) / meta.w * 111.32 * Math.cos(Cesium.Math.toRadians(23.67)) * (meta.north - meta.south) / meta.h * 110.57;
    $("info").textContent = `Flooded area: ${(n * cellKm2).toFixed(2)} km²  |  source ground: ${dem[idx(src.lon, src.lat)].toFixed(1)} m`;
  }

  // ---- Events ----
  document.querySelectorAll("input[name=mode]").forEach(r => r.onchange = () => { mode = +r.value; updateLevel(level); });
  $("level").oninput = e => updateLevel(+e.target.value);
  $("rmin").onchange = $("rmax").onchange = recompute;
  $("speed").oninput = e => $("spdv").textContent = e.target.value; $("spdv").textContent = $("speed").value;
  $("s2").onchange = e => s2.show = e.target.checked;
  $("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "⏸ Pause" : "▶ Play"; };
  $("reset").onclick = () => updateLevel(+$("rmin").value);

  new Cesium.ScreenSpaceEventHandler(scene.canvas).setInputAction(e => {
    const c = scene.globe.pick(viewer.camera.getPickRay(e.position), scene);  // terrain only, ignores water
    if (!c) return;
    const g = Cesium.Cartographic.fromCartesian(c);
    src = { lon: Cesium.Math.toDegrees(g.longitude), lat: Cesium.Math.toDegrees(g.latitude) };
    srcPin.position = Cesium.Cartesian3.fromDegrees(src.lon, src.lat);
    autoRange(); recompute();
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

  let last = performance.now();
  scene.preRender.addEventListener(() => {
    const now = performance.now(), dt = (now - last) / 1000; last = now;
    material.uniforms.time = now / 1000;
    if (playing) { updateLevel(level + dt * $("speed").value); if (level >= +$("rmax").value) $("play").click(); }
  });

  autoRange(); recompute();
  // Frame the study area (centred on the S2 footprint, slightly oblique view)
  $("play").click();   // start the simulation automatically
})();
</script>
</body>
</html>
